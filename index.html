<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinera</title>
<style>
  :root { --bg:#0e0e12; --card:#1a1a22; --text:#f2f2f5; --muted:#9a9aa8; --accent:#e50914; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; background:#000; }
  header h1 { margin:0; font-size:1.4rem; color:var(--accent); }
  main { padding:24px; max-width:1200px; margin:0 auto; }
  h2 { margin:36px 0 12px; font-size:1.2rem; }
  .live-badge { display:inline-block; background:var(--accent); color:#fff; padding:2px 8px; border-radius:4px; font-size:.75rem; font-weight:bold; margin-left:8px; vertical-align:middle; }

  /* Conteneur 16:9 pour les iframes */
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #live-status { color:var(--muted); margin:10px 0 0; }

  /* Filtres par catégorie */
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .filter { background:var(--card); color:var(--text); border:1px solid #2a2a35; border-radius:999px; padding:6px 14px; font-size:.9rem; cursor:pointer; }
  .filter:hover { border-color:#444; }
  .filter.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .category-label { display:inline-block; font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; transition:transform .15s; }
  .card:hover { transform:scale(1.03); }
  .thumb { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; font-size:2rem; color:rgba(255,255,255,.7); }
  .card .info { padding:10px 12px; }
  .card small { color:var(--muted); }
  .empty { color:var(--muted); }

  #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:10; align-items:center; justify-content:center; padding:16px; }
  #modal.open { display:flex; }
  #modal .box { width:min(900px,100%); }
  #modal h3 { margin:12px 0 4px; }
  #modal p { color:var(--muted); margin:0; }
  #close { float:right; background:none; border:0; color:#fff; font-size:2rem; cursor:pointer; line-height:1; }
  footer { text-align:center; color:var(--muted); padding:40px 16px; font-size:.85rem; }
</style>
</head>
<body>

<header>
  <h1>Kinera</h1>
</header>

<main>

  <!-- ============ CONFIGURATION : modifiez ici ============ -->
  <script>
  const CONFIG = {
    siteName: "Kinera",

    live: {
      enabled: true,                  // false = affiche "hors ligne"
      title: "Direct en cours",
      channel: "hioljoseph034"  // votre nom d'utilisateur Twitch (en minuscules)
    },

    // Vidéos à la demande, hébergées sur Internet Archive
    // "category" = nom de la catégorie (une même catégorie regroupe plusieurs vidéos)
    // "id" = identifiant dans l'URL archive.org/details/IDENTIFIANT
    vod: [
      { title: "Épisode 1 - Le début", desc: "Premier épisode de la saison.", color: "#7c3aed",
        category: "Séries", type: "archive", id: "mon-identifiant-archive-1" },
      { title: "Épisode 2 - La suite", desc: "Deuxième épisode.", color: "#0ea5e9",
        category: "Séries", type: "archive", id: "mon-identifiant-archive-2" },
      { title: "La vie des océans", desc: "Un documentaire sur les océans.", color: "#16a34a",
        category: "Documentaires", type: "archive", id: "mon-identifiant-archive-3" },
      { title: "Le Grand Voyage", desc: "Un film d'aventure.", color: "#ca8a04",
        category: "Films", type: "archive", id: "mon-identifiant-archive-4" }
    ],

    // Rediffusions : directs passés archivés sur Twitch
    // "type" = "twitch" (ID numérique de l'URL twitch.tv/videos/ID) ou "youtube"
    replays: [
      { title: "Direct du 12 octobre", desc: "Replay complet du live.", date: "2026-10-12", color: "#ea580c",
        type: "twitch", id: "123456789" },
      { title: "Direct du 28 octobre", desc: "Replay complet du live.", date: "2026-10-28", color: "#db2777",
        type: "twitch", id: "123456790" }
    ]
  };
  </script>

  <!-- ============ DIRECT ============ -->
  <h2>Direct <span class="live-badge" id="live-badge" style="display:none">LIVE</span></h2>
  <div class="player" id="live-box"></div>
  <p id="live-status"></p>

  <!-- ============ VOD ============ -->
  <h2>Vidéos à la demande</h2>
  <div class="filters" id="filters"></div>
  <div class="grid" id="vod-grid"></div>

  <!-- ============ REPLAYS ============ -->
  <h2>Rediffusions</h2>
  <div class="grid" id="replay-grid"></div>

</main>

<!-- Lecteur modal pour VOD et replays -->
<div id="modal">
  <div class="box">
    <button id="close" aria-label="Fermer">&times;</button>
    <div class="player" id="modal-player"></div>
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
  </div>
</div>

<footer>Kinera · Site hébergé sur GitHub Pages · Direct via Twitch · Vidéos via Internet Archive</footer>

<script>
  const $ = (id) => document.getElementById(id);

  // Construit l'URL d'intégration selon la plateforme
  function embedUrl(item) {
    if (item.type === "twitch") {
      return twitchUrl("video=v" + encodeURIComponent(item.id));
    }
    if (item.type === "youtube") {
      return "https://www.youtube.com/embed/" + encodeURIComponent(item.id) + "?autoplay=1&rel=0";
    }
    return "https://archive.org/embed/" + encodeURIComponent(item.id);
  }

  // Twitch exige le nom de domaine du site dans "parent" (GitHub Pages ou localhost)
  function twitchUrl(params) {
    const parent = location.hostname || "localhost";
    return "https://player.twitch.tv/?" + params + "&parent=" + encodeURIComponent(parent);
  }

  function makeIframe(src) {
    const iframe = document.createElement("iframe");
    iframe.src = src;
    iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.title = "Lecteur vidéo";
    return iframe;
  }

  // ---------- DIRECT ----------
  function initLive() {
    const box = $("live-box");
    const status = $("live-status");
    if (!CONFIG.live.enabled) {
      box.style.display = "none";
      status.textContent = "Le direct est actuellement hors ligne.";
      return;
    }
    box.appendChild(makeIframe(
      twitchUrl("channel=" + encodeURIComponent(CONFIG.live.channel))
    ));
    $("live-badge").style.display = "inline-block";
    status.textContent = CONFIG.live.title;
  }

  // ---------- CARTES ----------
  function makeCard(item, subtitle) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb">▶</div>
      <div class="info"><strong></strong><br><small></small></div>`;
    card.querySelector(".thumb").style.background = item.color || "#333";
    card.querySelector("strong").textContent = item.title;
    card.querySelector("small").textContent = subtitle || "";
    card.addEventListener("click", () => openModal(item));
    return card;
  }

  // ---------- VOD PAR CATÉGORIE ----------
  // Liste des catégories, dans l'ordre de première apparition dans CONFIG.vod
  function getCategories() {
    const cats = [];
    CONFIG.vod.forEach(item => {
      const c = item.category || "Autres";
      if (!cats.includes(c)) cats.push(c);
    });
    return cats;
  }

  function renderFilters(categories, onChange) {
    const bar = $("filters");
    bar.innerHTML = "";
    ["Tous", ...categories].forEach((name, i) => {
      const btn = document.createElement("button");
      btn.className = "filter" + (i === 0 ? " active" : "");
      btn.textContent = name;
      btn.addEventListener("click", () => {
        bar.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        onChange(name);
      });
      bar.appendChild(btn);
    });
  }

  function renderVod(filter) {
    const grid = $("vod-grid");
    grid.innerHTML = "";
    const items = CONFIG.vod.filter(item =>
      filter === "Tous" || (item.category || "Autres") === filter
    );
    if (items.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Aucune vidéo dans cette catégorie pour le moment.";
      grid.appendChild(p);
      return;
    }
    items.forEach(item => grid.appendChild(makeCard(item, item.desc)));
  }

  // ---------- REPLAYS ----------
  function renderReplays() {
    const grid = $("replay-grid");
    CONFIG.replays
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date))
      .forEach(item => grid.appendChild(makeCard(item, "Diffusé le " + item.date)));
  }

  // ---------- MODAL ----------
  function openModal(item) {
    const box = $("modal-player");
    box.innerHTML = "";
    box.appendChild(makeIframe(embedUrl(item)));
    $("modal-title").textContent = item.title;
    $("modal-desc").textContent = item.desc || "";
    $("modal").classList.add("open");
  }

  function closeModal() {
    $("modal-player").innerHTML = "";
    $("modal").classList.remove("open");
  }

  $("close").addEventListener("click", closeModal);
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  // ---------- INIT ----------
  initLive();
  renderFilters(getCategories(), renderVod);
  renderVod("Tous");
  renderReplays();
</script>

</body>
</html>
